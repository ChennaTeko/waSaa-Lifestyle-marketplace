<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>waSaa Lifestyle | Favorites</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: #f8f9fa; color: #111111; padding-bottom: 60px; }

        .navbar { background: #ffffff; border-bottom: 1px solid #e5e5e5; position: sticky; top: 0; z-index: 1000; padding: 14px 24px; }
        .nav-container { max-width: 1300px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }
        
        .logo { font-weight: 800; font-size: 1.5rem; color: #ff003b; letter-spacing: -0.5px; text-decoration: none; display: flex; align-items: center; gap: 6px; }
        .logo span { color: #111; font-size: 0.82rem; font-weight: 700; text-transform: uppercase; }

        .user-menu { display: flex; align-items: center; gap: 16px; }
        .icon-btn { text-decoration: none; font-size: 1.25rem; display: flex; align-items: center; justify-content: center; width: 38px; height: 38px; border-radius: 50%; background: #f2f2f2; }
        .icon-btn.active { background: #ffe6ea; }
        .user-avatar { width: 38px; height: 38px; background: #111111; color: #ffffff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.85rem; text-decoration: none; }

        .hero-banner { background: #ff003b; color: #ffffff; padding: 36px 24px; }
        .hero-content { max-width: 1300px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
        .hero-banner h1 { font-size: 2.2rem; font-weight: 800; letter-spacing: -1px; }
        .badge-tag { background: rgba(255, 255, 255, 0.25); padding: 6px 14px; border-radius: 20px; font-size: 0.82rem; font-weight: 700; }

        .main-container { max-width: 1300px; margin: 30px auto; padding: 0 24px; }
        .section-header { margin-bottom: 24px; }
        .section-header h2 { font-size: 1.4rem; font-weight: 800; }
        .section-subtitle { color: #666; font-size: 0.9rem; margin-top: 4px; }

        .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 20px; }
        
        .service-card { background: #ffffff; border-radius: 12px; overflow: hidden; border: 1px solid #e8e8e8; transition: transform 0.2s ease, box-shadow 0.2s ease; display: flex; flex-direction: column; }
        .service-card:hover { transform: translateY(-4px); box-shadow: 0 10px 24px rgba(0,0,0,0.08); }

        .card-image-wrapper { position: relative; width: 100%; height: 180px; background-color: #e2e8f0; }
        .card-image-wrapper img { width: 100%; height: 100%; object-fit: cover; }
        
        .btn-remove-fav { position: absolute; top: 10px; right: 10px; background: rgba(255, 255, 255, 0.95); border: none; width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.15); font-size: 1rem; }

        .card-body { padding: 18px; display: flex; flex-direction: column; flex: 1; justify-content: space-between; }
        .card-title { font-size: 1.1rem; font-weight: 700; color: #111; margin-bottom: 6px; line-height: 1.3; }
        .card-tags { font-size: 0.82rem; color: #666; margin-bottom: 14px; line-height: 1.4; }

        .card-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #f0f0f0; padding-top: 12px; margin-top: auto; }
        .location-badge { font-size: 0.85rem; font-weight: 600; color: #444; }
        .btn-contact { background: #ff003b; color: #fff; border: none; padding: 6px 14px; border-radius: 16px; font-weight: 700; font-size: 0.78rem; cursor: pointer; text-decoration: none; }

        .empty-state { text-align: center; padding: 60px 20px; background: #ffffff; border-radius: 12px; border: 1px dashed #ccc; }
        .empty-state h3 { font-size: 1.2rem; font-weight: 700; margin-bottom: 8px; }
        .empty-state p { color: #666; font-size: 0.9rem; margin-bottom: 20px; }
        .btn-browse { background: #111; color: #fff; padding: 10px 20px; border-radius: 20px; text-decoration: none; font-weight: 700; font-size: 0.9rem; }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">waSaa <span>lifestyle</span></a>
            
            <div class="user-menu">
                
                <a href="notifications.html" class="icon-btn" title="Business Messages & Availability">🔔</a>
                <a href="profile.html" class="user-avatar" title="My Profile">CS</a>
                <a href="index.html" class="icon-btn" title="Home Feed">🏠</a>
            </div>
        </div>
    </header>

    <section class="hero-banner">
        <div class="hero-content">
            <h1>Your Favorites</h1>
            <span class="badge-tag" id="fav-count-badge">0 Items Saved</span>
        </div>
    </section>

    <main class="main-container">
        <div class="section-header">
            <h2>Saved Services</h2>
            <p class="section-subtitle">Quick access to local services you've saved</p>
        </div>

        <div class="card-grid" id="favorites-grid"></div>

        <div class="empty-state" id="empty-favorites" style="display: none;">
            <h3>No favorites saved yet</h3>
            <p>Explore search results on the homepage and click heart icons to save your top picks here!</p>
            <a href="index.html" class="btn-browse">Browse Services</a>
        </div>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", loadSavedFavorites);

        function getFavorites() {
            try {
                return JSON.parse(localStorage.getItem("wasaa_favorites")) || [];
            } catch (e) {
                return [];
            }
        }

        function loadSavedFavorites() {
            const favorites = getFavorites();
            const grid = document.getElementById("favorites-grid");
            const emptyState = document.getElementById("empty-favorites");
            const countBadge = document.getElementById("fav-count-badge");

            countBadge.textContent = `${favorites.length} Items Saved`;

            if (favorites.length === 0) {
                grid.style.display = "none";
                emptyState.style.display = "block";
                return;
            }

            grid.style.display = "grid";
            emptyState.style.display = "none";
            grid.innerHTML = "";

            favorites.forEach((item, index) => {
                const card = document.createElement("div");
                card.className = "service-card";
                card.innerHTML = `
                    <div class="card-image-wrapper">
                        <img src="${item.image || 'https://images.unsplash.com/photo-1521737711867-e3b97375f902?w=500&q=80'}" alt="${item.service_name}">
                        <button class="btn-remove-fav" onclick="removeSavedFavorite(${index})" title="Remove from Favorites">🗑️</button>
                    </div>
                    <div class="card-body">
                        <div>
                            <h3 class="card-title">${item.service_name}</h3>
                            <p class="card-tags">🏷️ ${item.category}</p>
                        </div>
                        <div class="card-footer">
                            <span class="location-badge">📍 ${item.area}</span>
                            <a href="notifications.html" class="btn-contact">Message</a>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

//addition
const BACKEND_URL = 'http://localhost:8000';

// Run automatically when the favorites page loads
document.addEventListener('DOMContentLoaded', async () => {
  const favoritesContainer = document.getElementById('favoritesContainer'); // Ensure this ID exists in your HTML
  const user = JSON.parse(localStorage.getItem('user'));

  if (!user || !user.id) {
    favoritesContainer.innerHTML = `<p>Please <a href="signup.html">log in</a> to see your personal favorites list.</p>`;
    return;
  }

  try {
    // Fetch favorites explicitly for this user ID
    const res = await fetch(`${BACKEND_URL}/api/favorites/${user.id}`);
    const favorites = await res.json();

    if (!res.ok) throw new Error('Failed to load favorites');

    if (favorites.length === 0) {
      favoritesContainer.innerHTML = `<p>Your favorites list is currently empty!</p>`;
      return;
    }

    // Render the list dynamically into the container
    favoritesContainer.innerHTML = favorites.map(fav => `
      <div class="favorite-card" id="card-${fav.itemId}">
        <img src="${fav.image || 'placeholder.jpg'}" alt="${fav.title}" style="width:100px;">
        <h3>${fav.title}</h3>
        <button onclick="removeFavoriteFromPage('${fav.itemId}', '${fav.title}')">Delete 🗑️</button>
      </div>
    `).join('');

  } catch (err) {
    console.error(err);
    favoritesContainer.innerHTML = `<p>Error loading your favorite items. Please try again later.</p>`;
  }
});

// Quick delete item wrapper directly on the favorites page
async function removeFavoriteFromPage(itemId, title) {
  const user = JSON.parse(localStorage.getItem('user'));
  try {
    const res = await fetch(`${BACKEND_URL}/api/favorites/toggle`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ userId: user.id, itemId, title })
    });
    
    if (res.ok) {
      // Smoothly remove the HTML card container element visually right away
      document.getElementById(`card-${itemId}`)?.remove();
    }
  } catch (err) {
    console.error(err);
  }
}


        function removeSavedFavorite(index) {
            let favorites = getFavorites();
            favorites.splice(index, 1);
            localStorage.setItem("wasaa_favorites", JSON.stringify(favorites));
            loadSavedFavorites();
        }
    </script>
</body>


</html>
