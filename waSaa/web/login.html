<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>waSaa Lifestyle | Log In</title>
    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: #f8f9fa; color: #111111; min-height: 100vh; display: flex; flex-direction: column; }

        .navbar { background: #ffffff; border-bottom: 1px solid #e5e5e5; padding: 14px 24px; }
        .nav-container { max-width: 1300px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-weight: 800; font-size: 1.5rem; color: #ff003b; text-decoration: none; display: flex; align-items: center; gap: 6px; }
        .logo span { color: #111; font-size: 0.82rem; text-transform: uppercase; }

        .auth-wrapper { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 24px; }
        .auth-card { background: #ffffff; border: 1px solid #e8e8e8; border-radius: 16px; padding: 36px; width: 100%; max-width: 420px; box-shadow: 0 8px 24px rgba(0,0,0,0.04); }
        
        .auth-title { font-size: 1.6rem; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 6px; }
        .auth-subtitle { color: #666; font-size: 0.88rem; margin-bottom: 24px; }

        .google-btn-wrapper { width: 100%; margin-bottom: 4px; display: flex; justify-content: center; }

        .divider { display: flex; align-items: center; margin: 20px 0; color: #888; font-size: 0.8rem; }
        .divider hr { flex: 1; border: none; border-top: 1px solid #eee; }
        .divider span { padding: 0 10px; font-weight: 600; }

        .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px; }
        .form-group label { font-size: 0.85rem; font-weight: 700; color: #111; }
        .form-group input { border: 1px solid #ddd; padding: 12px 16px; border-radius: 10px; font-size: 0.95rem; outline: none; font-weight: 500; }
        .form-group input:focus { border-color: #ff003b; }

        .btn-submit { width: 100%; background: #ff003b; color: #ffffff; border: none; padding: 12px; border-radius: 20px; font-weight: 800; font-size: 0.95rem; cursor: pointer; transition: background 0.2s; margin-top: 8px; }
        .btn-submit:hover { background: #d60031; }

        .auth-footer { text-align: center; margin-top: 20px; font-size: 0.88rem; color: #666; }
        .auth-footer a { color: #ff003b; font-weight: 700; text-decoration: none; }

        .code-inputs { display: flex; gap: 10px; justify-content: center; margin: 20px 0; }
        .code-inputs input { width: 48px; height: 56px; text-align: center; font-size: 1.4rem; font-weight: 800; border: 1px solid #ccc; border-radius: 10px; outline: none; }
        .code-inputs input:focus { border-color: #ff003b; }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">waSaa <span>lifestyle</span></a>
            <a href="index.html" style="text-decoration: none; font-size: 1.2rem;">🏠</a>
        </div>
    </header>

    <main class="auth-wrapper">
        <!-- Step 1: Login Form -->
        <div class="auth-card" id="login-step">
            <h1 class="auth-title">Welcome Back</h1>
            <p class="auth-subtitle">Log in to manage your favorites and chats</p>

            <!-- Google Sign-In Setup -->
            <div id="g_id_onload"
                 data-client_id="489059479806-k1ajuj37bb0vl2nji25kgf4ueq5o2u9g.apps.googleusercontent.com"
                 data-callback="handleGoogleSignIn">
            </div>
            <div class="google-btn-wrapper">
                <div class="g_id_signin" 
                     data-type="standard" 
                     data-shape="pill" 
                     data-theme="outline" 
                     data-text="signin_with" 
                     data-size="large" 
                     data-width="348">
                </div>
            </div>

            <div class="divider">
                <hr>
                <span>OR</span>
                <hr>
            </div>

            <form id="login-form">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="login-email" placeholder="name@example.com" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="login-password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-submit">Continue to 2FA</button>
            </form>

            <div class="auth-footer">
                Don't have an account? <a href="signup.html">Sign Up</a>
            </div>
        </div>

        <!-- Step 2: 2FA Verification Form (Hidden Initially) -->
        <div class="auth-card" id="2fa-step" style="display: none;">
            <h1 class="auth-title">2FA Verification</h1>
            <p class="auth-subtitle">We sent a 4-digit code to <strong id="sent-email-display"></strong></p>

            <form id="2fa-form">
                <div class="code-inputs">
                    <input type="text" maxlength="1" class="otp-input" required autofocus>
                    <input type="text" maxlength="1" class="otp-input" required>
                    <input type="text" maxlength="1" class="otp-input" required>
                    <input type="text" maxlength="1" class="otp-input" required>
                </div>

                <button type="submit" class="btn-submit">Verify & Sign In</button>
            </form>

            <div class="auth-footer">
                Didn't receive code? <a href="#" id="resend-code-btn">Resend Code</a>
            </div>
        </div>
    </main>

    <script src="js/auth.js"></script>
</body>
</html>
